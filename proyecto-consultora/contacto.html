<!DOCTYPE html>
<html lang="es">
<head>
    <link rel="shortcut icon" type="image/x-icon" href="./img/favicon.ico">
    <link rel="stylesheet" href="styles.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Página de contacto de Consultora ZaTech - Tu consultora de confianza en tecnología y negocios. Ofrecemos soluciones innovadoras para impulsar tu empresa hacia el éxito.">
    <title>Contacto con consultora ZaTech, un negocio innovador y a la vanguardia</title>
</head>
<body>
    <header>
        <img src="logo.png" alt="Logo de Consultora ZaTech">
        <nav>
            <ul>
                <li><a href="./proyecto-reservas.html">Reservas</a></li>
                <li><a href="./cronologia.html">Cronología</a></li>
                <li><a href="./contacto.html">Contacto</a></li>
                <li><a href="./index.html">Inicio</a></li>
            </ul>
    </header>
    <main> 
        <form action="morning-paper-a0fc.contry-1990.workers.dev" method="post">
            <fieldset>
                <legend>Formulario de Contacto</legend>
            <label for="nombre">Nombre:</label>
            <input type="text" id="nombre" name="nombre" placeholder="Ej: Nombre Apellido Apellido" autofocus  tabindex="1" required>
            <span class="required-label">(Campo obligatorio)</span>
            
            <label for="email">Correo Electrónico:</label>
            <input type="email" id="email" name="email" placeholder="Ej: correo@gmail.com"  tabindex="2" required>
            <span class="required-label">(Campo obligatorio)</span>

            <label for="telefono">Teléfono:</label>
            <input type="tel" id="telefono" name="telefono" placeholder="Ej: 965600600" pattern="[0-9]{9}"  tabindex="3" required>
            <span class="required-label">(Campo obligatorio)</span>

            <label for="motivo">Tipo de servicio:</label>
            <select id="motivo" name="motivo"  tabindex="4" required>
                <option selected>Seleccione un servicio</option>
                <option value="Desarrollo Web">Desarrollo Web</option>
                <option value="Cloud Computing">Cloud Computing</option>
                <option value="Ciberseguridad">Ciberseguridad</option>
            </select>
            <span class="required-label">(Campo obligatorio)</span>

            <label for="mensaje">Mensaje:</label>
            <textarea id="mensaje" name="mensaje" placeholder="Escriba su consulta" minlength="10" required tabindex="5" ></textarea>
            <span class="required-label">(Campo obligatorio)</span>
            
            <input type="checkbox" id="privacidad" name="privacidad" aria-label="Casilla de política de privacidad"  tabindex="6" required>
            <label for="privacidad">Acepto la <a href="./privacy-policy.html">Política de Privacidad</a></label>
            <span class="required-label">(Campo obligatorio)</span>

            <button aria-label="Enviar mensaje" type="submit"  tabindex="7">Enviar</button>
            </fieldset>
        </form>
    </main>
    <footer>
        <p>&copy; 2025 Consultora ZaTech. All rights reserved.</p>
        <a target="_blank" href="./privacy-policy.html">Privacy Policy</a>
        <a target="_blank" href="./aviso-legal.html">Aviso Legal</a>
        <a target="_blank" href="https:/www.facebook.com">Facebook</a>
    </footer>
</body>
</html>
