<!DOCTYPE html>
<html lang="es">
  <head>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Merriweather:ital,opsz,wght@0,18..144,300..900;1,18..144,300..900&display=swap"
      rel="stylesheet"
    />
    <link rel="shortcut icon" type="image/x-icon" href="./img/favicon.ico" />
    <link rel="stylesheet" href="./css/styles.css" />
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Página de contacto de Consultora ZaTech - Tu consultora de confianza en tecnología y negocios. Ofrecemos soluciones innovadoras para impulsar tu empresa hacia el éxito."
    />
    <title>
      Contacto con consultora ZaTech, un negocio innovador y a la vanguardia
    </title>
  </head>
  <body>
    <header>
      <nav>
        <div class="nav-logo">
          <img id="logo" src="./img/logo.png" alt="Logo de Consultora ZaTech" />
        </div>
        <div class="nav-ul">
          <ul>
            <li><a href="./proyecto-reservas.html">Reservas</a></li>
            <li><a href="./cronologia.html">Cronología</a></li>
            <li><a href="./contacto.html">Contacto</a></li>
            <li><a href="./index.html">Inicio</a></li>
          </ul>
        </div>
      </nav>
    </header>
    <main>
      <form
        action="https://morning-paper-a0fc.contry-1990.workers.dev"
        method="post"
      >
        <div class="contacto-box">
          <fieldset>
            <legend>Formulario de Contacto</legend>
            <div class="info-contacto">
              <div class="apartado-contacto">
                <label for="nombre">Nombre:</label>
                <input
                  type="text"
                  id="nombre"
                  name="nombre"
                  placeholder="Ej: Nombre Apellido1 Apellido2"
                  autofocus
                  tabindex="1"
                  required
                />
                <span class="required-label">(Campo obligatorio)</span>
              </div>
              <div class="apartado-contacto">
                <label for="email">Correo Electrónico:</label>
                <input
                  type="email"
                  id="email"
                  name="email"
                  placeholder="Ej: correo@gmail.com"
                  tabindex="2"
                  required
                />
                <span class="required-label">(Campo obligatorio)</span>
              </div>
            </div>
            <div class="info-contacto">
              <div class="apartado-contacto">
                <label for="telefono">Teléfono:</label>
                <input
                  type="tel"
                  id="telefono"
                  name="telefono"
                  placeholder="Ej: 965600600"
                  pattern="[0-9]{9}"
                  tabindex="3"
                  required
                />
                <span class="required-label">(Campo obligatorio)</span>
              </div>

              <div class="apartado-contacto">
                <label for="motivo">Tipo de servicio:</label>
                <select id="motivo" name="motivo" tabindex="4" required>
                  <option selected>Seleccione un servicio</option>
                  <option value="Desarrollo Web">Desarrollo Web</option>
                  <option value="Cloud Computing">Cloud Computing</option>
                  <option value="Ciberseguridad">Ciberseguridad</option>
                </select>
                <span class="required-label">(Campo obligatorio)</span>
              </div>
            </div>
            <div class="apartado-contacto">
              <label for="mensaje">Mensaje:</label>
              <textarea
                id="mensaje"
                name="mensaje"
                placeholder="Escriba su consulta, mínimo 10 caracteres"
                minlength="10"
                required
                tabindex="5"
              ></textarea>
              <span class="required-label">(Campo obligatorio)</span>
            </div>
            <div class="apartado-contacto">
              <div id="privacidad-check">
                <input
                  type="checkbox"
                  id="privacidad"
                  name="privacidad"
                  aria-label="Casilla de política de privacidad"
                  tabindex="6"
                  required
                />
                <label for="privacidad"
                  >Acepto la
                  <a href="./privacy-policy.html"
                    >Política de Privacidad</a
                  ></label
                >
              </div>
              <div>
                <span class="required-label">(Campo obligatorio)</span>
              </div>
            </div>
            <div class="apartado-contacto">
              <button aria-label="Enviar mensaje" type="submit" tabindex="7">
                Enviar
              </button>
            </div>
          </fieldset>
        </div>
      </form>
    </main>
    <footer>
      <div class="footer">
        <p>&copy; 2025 Consultora ZaTech. All rights reserved.</p>
        <a target="_blank" href="./privacy-policy.html">Privacy Policy</a>
        <a target="_blank" href="./aviso-legal.html">Aviso Legal</a>
        <a target="_blank" href="https:/www.facebook.com">Facebook</a>
      </div>
    </footer>
  </body>
</html>
